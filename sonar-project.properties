# SonarQube Community Build project configuration (C-023, ADR-012).
# Community Build analyses the main branch only; pull requests are gated by ESLint + SonarJS rules
# and tests in .github/workflows/ci.yml. The server is not set up yet (where it runs is undecided).
sonar.projectKey=bytespate_hms
sonar.projectName=Hospital ERP (SaaS)
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/e2e/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/generated/**,\
  packages/database/prisma/migrations/**,**/*.d.ts,**/playwright-report/**

# LCOV reports written by `vitest run --coverage`. Add each package here when it gains tests.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,packages/contracts/coverage/lcov.info

sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/*.config.*,packages/contracts/**,\
  packages/i18n/**,packages/testkit/**,apps/web/app/**/layout.tsx
sonar.cpd.exclusions=**/generated/**,packages/contracts/**
